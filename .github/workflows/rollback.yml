name: ROLLBACK-WORKFLOW

'on':
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID (FIELD)'
        required: true
        type: string

      target_version:
        description: 'Rollback Version (FIXED)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback Start
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          echo "================================"
          echo "Rollback Started"
          echo "Ticket ID: $TICKET_ID"
          echo "Target Version: $TARGET_VERSION"
          echo "================================"

          sleep 10

          echo "Rollback Completed"
