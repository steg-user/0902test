name: ROLLBACK-WORKFLOW

'on':
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Rollback target version'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback Start
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          echo "Rollback target: $TARGET_VERSION"
          echo "Rollback started"
          sleep 10
          echo "Rollback completed"
